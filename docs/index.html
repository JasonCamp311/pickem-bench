<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick'em Bench</title>
<style>
  :root {
    --bg: #0c1117; --panel: #141b24; --line: #243040; --text: #e6edf3; --dim: #8b98a8;
    --win: #3fb950; --loss: #f0606a; --push: #d0a84a; --accent: #6cb6ff;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0; font-size: 30px; letter-spacing: -0.02em; }
  h2 { margin: 40px 0 12px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .lede { color: var(--dim); max-width: 68ch; margin: 8px 0 0; }
  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: 12px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
  td.num, th.num { text-align: right; font-family: var(--mono); }
  .tag { font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); margin-left: 6px; }
  .pct { color: var(--dim); margin-left: 6px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .grid td { vertical-align: top; }
  .match { font-weight: 600; }
  .sub { color: var(--dim); font-size: 12px; }
  .pick { font-family: var(--mono); font-size: 13px; }
  .W { color: var(--win); } .L { color: var(--loss); } .P, .T { color: var(--push); }
  .chip { font-size: 11px; font-family: var(--mono); margin-left: 6px; }
  .star { color: var(--push); }
  .empty { padding: 28px; color: var(--dim); }
  footer { margin-top: 40px; color: var(--dim); font-size: 13px; max-width: 80ch; }
  footer code { font-family: var(--mono); color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>Pick'em Bench</h1>
  <p class="lede">AI models pick every NFL game from the same football-only prompt: schedule, records and scores, no betting lines. Picks lock before kickoff, then get graded straight-up and against the closing spread.</p>

  <h2 id="season-title">Season</h2>
  <div class="scroll" id="leaderboard"></div>

  <h2>Week by week</h2>
  <div class="tabs" id="tabs"></div>
  <div class="scroll" id="grid"></div>

  <footer id="foot"></footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
const pct = (w, l) => (w + l ? (w / (w + l) * 100).toFixed(0) + '%' : '');
const fmtLine = (g) => g.line ? (g.line.homeLine === 0 ? 'pick\'em' : `${g.home} ${g.line.homeLine > 0 ? '+' : ''}${g.line.homeLine}`) : 'no line yet';
const fmtKick = (iso) => new Date(iso).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

function leaderboard(data, totals, target) {
  target.replaceChildren();
  const rows = data.contestants.map((c) => ({ c, t: totals[c.id] })).filter((r) => r.t && r.t.n);
  if (!rows.length) { target.append(el('div', 'empty', 'No games graded yet. Picks are locked below.')); return; }
  const atsPct = (t) => (t.atsN - t.ats[2] > 0 ? t.ats[0] / (t.ats[0] + t.ats[1]) : -1);
  rows.sort((a, b) => atsPct(b.t) - atsPct(a.t) || b.t.su[0] - a.t.su[0]);
  const table = el('table');
  const head = el('tr');
  [['Contestant'], ['Straight up', 1], ['Against spread', 1], ['Exact finals', 1], ['Team scores hit', 1], ['Brier', 1], ['Avg margin miss', 1]]
    .forEach(([h, num]) => head.append(el('th', num ? 'num' : '', h)));
  table.append(head);
  for (const { c, t } of rows) {
    const tr = el('tr');
    const name = el('td', '', c.label);
    if (c.kind !== 'model') name.append(el('span', 'tag', c.kind));
    const su = el('td', 'num', `${t.su[0]}-${t.su[1]}${t.su[2] ? '-' + t.su[2] : ''}`);
    su.append(el('span', 'pct', pct(t.su[0], t.su[1])));
    const ats = el('td', 'num', t.atsN ? `${t.ats[0]}-${t.ats[1]}${t.ats[2] ? '-' + t.ats[2] : ''}` : 'n/a');
    if (t.atsN) ats.append(el('span', 'pct', pct(t.ats[0], t.ats[1])));
    const base = c.kind === 'baseline';
    tr.append(name, su, ats,
      el('td', 'num', base ? '' : String(t.exact)),
      el('td', 'num', base ? '' : String(t.teamHits)),
      el('td', 'num', (t.brierSum / t.n).toFixed(3)),
      el('td', 'num', base ? '' : (t.marginErrorSum / t.n).toFixed(1)));
    table.append(tr);
  }
  target.append(table);
}

function grid(data, week) {
  const target = $('grid');
  target.replaceChildren();
  const cols = data.contestants.filter((c) => week.games.some((g) => g.picks[c.id]));
  const table = el('table', 'grid');
  const head = el('tr');
  head.append(el('th', '', 'Game'));
  cols.forEach((c) => {
    const th = el('th', '', c.label);
    const t = week.totals[c.id];
    if (t) th.append(el('div', 'sub', `SU ${t.su[0]}-${t.su[1]}${t.atsN ? ` · ATS ${t.ats[0]}-${t.ats[1]}` : ''}`));
    head.append(th);
  });
  table.append(head);
  for (const g of week.games) {
    const tr = el('tr');
    const td = el('td');
    td.append(el('div', 'match', `${g.away} at ${g.home}`));
    td.append(el('div', 'sub', g.status === 'final' ? `Final ${g.away} ${g.awayScore}, ${g.home} ${g.homeScore}` : fmtKick(g.kickoff)));
    td.append(el('div', 'sub', `${g.line && g.line.closing ? 'Closed' : 'Line'}: ${fmtLine(g)}`));
    tr.append(td);
    for (const c of cols) {
      const p = g.picks[c.id];
      const cell = el('td');
      if (p) {
        const loser = p.winner === g.home ? g.away : g.home;
        const hi = Math.max(p.away_score, p.home_score), lo = Math.min(p.away_score, p.home_score);
        const main = el('div', 'pick' + (p.grade ? ' ' + p.grade.su : ''), c.kind === 'baseline' ? p.winner : `${p.winner} ${hi}-${lo}`);
        if (p.grade && p.grade.exact) main.append(el('span', 'star', ' ★'));
        if (p.grade && p.grade.ats) main.append(el('span', 'chip ' + p.grade.ats, `ATS ${p.grade.ats}`));
        cell.append(main);
        if (c.kind !== 'baseline') cell.append(el('div', 'sub', `${Math.round(p.confidence * 100)}% over ${loser}`));
        if (p.reason) cell.title = p.reason;
      }
      tr.append(cell);
    }
    table.append(tr);
  }
  target.append(table);
}

fetch('data.json', { cache: 'no-store' }).then((r) => r.json()).then((data) => {
  $('season-title').textContent = `${data.season} season`;
  leaderboard(data, data.totals, $('leaderboard'));
  if (!data.weeks.length) { $('grid').append(el('div', 'empty', 'No weeks yet.')); return; }
  const show = (week) => {
    [...$('tabs').children].forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.week) === week.week)));
    grid(data, week);
  };
  for (const w of data.weeks) {
    const b = el('button', '', `Week ${w.week}`);
    b.dataset.week = w.week;
    b.onclick = () => show(w);
    $('tabs').append(b);
  }
  show(data.weeks[data.weeks.length - 1]);
  $('foot').textContent = `ATS is implied: a model's predicted margin is compared with the closing spread it never saw. A star marks an exact final score. Brier is a calibration score, lower is better (0.25 is a coin flip). Hover a pick for the model's reason. Updated ${new Date(data.generatedAt).toLocaleString()}.`;
}).catch((err) => { $('leaderboard').append(el('div', 'empty', `Could not load data.json: ${err.message}`)); });
</script>
</body>
</html>
